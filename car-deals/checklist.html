<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Used Car Pre-Purchase Checklist — BC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; padding: 20px; color: #1a1a1a;
  }
  .container {
    max-width: 980px; margin: 0 auto; background: #fff;
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff; padding: 28px 32px;
  }
  header h1 { font-size: 1.9em; margin-bottom: 6px; }
  header p  { opacity: 0.85; font-size: 0.95em; }
  .top-nav {
    padding: 14px 32px; background: #f5f7fb; border-bottom: 1px solid #e5e7eb;
    display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.9em; align-items: center;
  }
  .top-nav a { color: #2a5298; text-decoration: none; font-weight: 500; }
  .top-nav a:hover { text-decoration: underline; }
  .top-nav .actions { margin-left: auto; display: flex; gap: 12px; }
  .top-nav button {
    background: #2a5298; color: #fff; border: none; padding: 6px 14px;
    border-radius: 6px; cursor: pointer; font-size: 0.9em;
  }
  .top-nav button:hover { background: #1e3c72; }
  .top-nav button.ghost { background: #fff; color: #2a5298; border: 1px solid #c8d2e0; }
  .tabs {
    display: flex; gap: 4px; padding: 16px 32px 0; background: #fff;
    border-bottom: 2px solid #e5e7eb; flex-wrap: wrap;
  }
  .tab {
    background: #f1f3f7; color: #444; border: none; padding: 10px 18px;
    border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.95em;
    font-weight: 500; transition: all 0.15s;
  }
  .tab:hover { background: #e5e9f2; }
  .tab.active { background: #2a5298; color: #fff; }
  .progress {
    position: sticky; top: 0; background: #fff; padding: 10px 32px;
    border-bottom: 1px solid #e5e7eb; font-size: 0.85em; color: #555;
    z-index: 10;
  }
  .bar { height: 6px; background: #eef0f3; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #2a5298, #4caf50); width: 0; transition: width 0.2s; }
  main { padding: 24px 32px 40px; }
  .car-intro {
    background: #fff8e1; border-left: 4px solid #f5b400; padding: 14px 18px;
    border-radius: 6px; margin-bottom: 24px; font-size: 0.92em; color: #5a4500;
  }
  .car-intro strong { color: #3d2f00; }
  section { margin-bottom: 24px; }
  h2 {
    font-size: 1.18em; padding-bottom: 8px; border-bottom: 2px solid #e5e7eb;
    margin-bottom: 12px; color: #203a43;
  }
  ul { list-style: none; margin-left: 4px; }
  li {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 7px 0; font-size: 0.95em; line-height: 1.5;
    border-bottom: 1px dashed #f1f3f7;
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    margin-top: 4px; width: 18px; height: 18px; cursor: pointer;
    accent-color: #2a5298; flex-shrink: 0;
  }
  li label { cursor: pointer; flex: 1; }
  li.done label { text-decoration: line-through; color: #888; }
  .note { color: #666; font-size: 0.85em; font-style: italic; }
  .info {
    background: #e8f5e9; border-left: 4px solid #2e7d32; padding: 10px 14px;
    border-radius: 4px; margin: 8px 0 12px; font-size: 0.88em; color: #1b5e20;
  }
  .warn {
    background: #ffebee; border-left: 4px solid #c62828; padding: 10px 14px;
    border-radius: 4px; margin: 8px 0 12px; font-size: 0.88em; color: #b71c1c;
  }
  @media print {
    body { background: #fff; padding: 0; color: #000; }
    .container { box-shadow: none; border-radius: 0; }
    .top-nav, .progress, .tabs { display: none; }
    header { background: #fff !important; color: #000 !important; }
    .panel:not(.active) { display: none; }
    li input[type="checkbox"] { -webkit-print-color-adjust: exact; }
  }
  @media (max-width: 700px) {
    body { padding: 8px; }
    header, .top-nav, .tabs, .progress, main { padding-left: 16px; padding-right: 16px; }
  }
  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>

      hybridSection: {
        title: 'Tesla-specific tech checks',
        intro: '<strong>MCU generation matters.</strong> 2017–early 2020 Model 3s shipped with MCU1 (Intel Atom, eMMC flash known to fail). Refresh MCU2 (2020+) is much better. Affects touchscreen responsiveness and app support. Check via Software → "Hardware" section.',
        items: [
          '<strong>Touchscreen MCU2 or later</strong> — verify in vehicle Software info. Mid-2020+ Model 3 has MCU2.',
          '<strong>Touchscreen responsiveness</strong>: open settings, dive in/out of menus. Lag or stuttering = MCU eMMC issue.',
          'All 8 cameras working — open Sentry Mode preview, check each angle.',
          'Sentry/Dashcam — USB stick installed? Otherwise plug one in and verify recording works.',
          '<strong>Autopilot tier</strong>: Basic Autopilot (standard 2019+) vs Enhanced Autopilot vs Full Self-Driving. Verify what\'s active in the car\'s software. <strong>FSD does not always transfer to a new owner</strong> — confirm with Tesla using the VIN.',
          '<strong>Premium Connectivity</strong>: included free first year on new sale, then $9.99/mo. Status in account.',
          '<strong>Door handles</strong>: external motorized handles work cleanly. Internal manual release works (especially rear — train passengers).',
          '<strong>Frunk + trunk</strong>: open, close, latch firmly. Frunk hood has hinge wear point.',
          'No spare tire — only a tire repair kit. Check it\'s present and unused.',
          '<strong>Suspension</strong>: 2017–2020 had a recall on lower control arms — confirm completed (check VIN against Tesla\'s recall site).',
          'No engine bay smell — but check frunk drain holes (clogs cause water in frunk).',
        ],
      },
      testDriveItems: [
        '<strong>Set vehicle to Chill mode</strong> for the test drive — gives a more representative learner-driver experience.',
        'Steering centered on straight road. Tesla\'s steering is light by default — try Standard and Sport in Settings.',
        'Gentle accel — instant torque means smoother than ICE but unfamiliar. <strong>This is the dealbreaker check for a new driver</strong>.',
        '<strong>Single-pedal regen</strong>: lift off accelerator → strong deceleration. Verify it\'s smooth, predictable. If the new driver will be on this car, ensure they\'re comfortable with regen behavior — it rewires brake habits.',
        'Hard accel in safe spot — note the urgency. Even Chill mode is quicker than most ICE cars.',
        'Hard brake — pads do little work; regen + mechanical blend should be smooth.',
        'Bumps — Tesla suspension is firmer than expected. Some bushings wear by 100k km.',
        'Cruise control / Autopilot — engage on highway, verify lane keeping is reasonable. Note: Autopilot has limits in rain/snow.',
        'Highway: no surging, no battery warnings. AC on full → minimal range hit but should hold.',
        'After test drive: check tire wear (rear tires wear fast on RWD Standard Range models).',
      ],
      extraNote: {
        type: 'warn',
        text: '<strong>Before committing to Tesla, double-check your insurance quote.</strong> Call ICBC or your broker with the VIN of the specific car. Premiums for a Model 3 in BC are typically $600–900/yr higher than a Corolla Hybrid. Over 5 years that\'s $3,000–4,500 — meaningful against the fuel savings.',
      },
    },
  ];

  // ─── rendering ─────────────────────────────────────────────────────────
  const tabsEl  = document.getElementById('tabs');
  const mainEl  = document.getElementById('main');
  const labelEl = document.getElementById('active-car-label');
  const STORAGE = 'car-checklist-state-v2';

  // State: { [carKey]: [bool, bool, ...] }
  let state = {};
  try { state = JSON.parse(localStorage.getItem(STORAGE) || '{}') || {}; } catch (e) {}

  let activeKey = CARS[0].key;

  function sectionHtml(title, items, intro) {
    const introHtml = intro ? `<div class="info">${intro}</div>` : '';
    const rows = items.map(it => `<li><input type="checkbox"><label>${it}</label></li>`).join('');
    return `<section><h2>${title}</h2>${introHtml}<ul>${rows}</ul></section>`;
  }

  function buildPanel(car) {
    const parts = [];
    parts.push(`<div class="car-intro">${car.intro}</div>`);
    parts.push(sectionHtml('1. Before you go (online, 10 min)', BEFORE_YOU_GO));
    parts.push(sectionHtml('2. Documents (at the viewing)', DOCS_AT_VIEWING));
    parts.push(sectionHtml('3. Exterior walk-around', EXTERIOR));
    parts.push(sectionHtml('4. ' + car.engineTitle, car.engineItems));
    if (car.hybridSection) {
      parts.push(sectionHtml('5. ' + car.hybridSection.title, car.hybridSection.items, car.hybridSection.intro));
    }
    if (car.mazdaQuirks) {
      parts.push(sectionHtml('5. ' + car.mazdaQuirks.title, car.mazdaQuirks.items));
    }
    const nextIdx = (car.hybridSection || car.mazdaQuirks) ? 6 : 5;
    parts.push(sectionHtml(nextIdx + '. Interior & electronics', INTERIOR_COMMON));
    parts.push(sectionHtml((nextIdx + 1) + '. Test drive (≥20 min, mixed)', car.testDriveItems));
    parts.push(sectionHtml((nextIdx + 2) + '. Independent inspection', INSPECTION));
    parts.push(sectionHtml((nextIdx + 3) + '. Negotiation & close', NEGOTIATION));
    parts.push(`<section><h2>${nextIdx + 4}. Red flags — walk away</h2><div class="warn">Any one of these alone is a deal-breaker.</div><ul>${
      RED_FLAGS.map(it => `<li><input type="checkbox"><label>${it}</label></li>`).join('')
    }</ul></section>`);
    if (car.extraNote) {
      const cls = car.extraNote.type === 'warn' ? 'warn' : 'info';
      parts.push(`<section><div class="${cls}">${car.extraNote.text}</div></section>`);
    }
    return parts.join('');
  }

  function renderTabs() {
    tabsEl.innerHTML = CARS.map(c =>
      `<button class="tab${c.key === activeKey ? ' active' : ''}" data-key="${c.key}">${c.tabLabel}</button>`
    ).join('');
    tabsEl.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => switchTo(t.dataset.key));
    });
  }

  function renderPanel() {
    const car = CARS.find(c => c.key === activeKey);
    mainEl.innerHTML = `<div class="panel active" data-car="${car.key}">${buildPanel(car)}</div>`;
    labelEl.textContent = '· Active car: ' + car.title;

    const boxes = mainEl.querySelectorAll('input[type="checkbox"]');
    const saved = state[car.key] || [];
    boxes.forEach((b, i) => {
      if (saved[i]) b.checked = true;
      b.addEventListener('change', () => { onCheck(boxes); });
    });
    mainEl.querySelectorAll('li').forEach(li => {
      const cb = li.querySelector('input');
      const lbl = li.querySelector('label');
      if (cb && lbl) lbl.addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        e.preventDefault();
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
      });
    });
    updateProgress(boxes);
  }

  function onCheck(boxes) {
    const arr = Array.from(boxes).map(b => b.checked);
    state[activeKey] = arr;
    try { localStorage.setItem(STORAGE, JSON.stringify(state)); } catch (e) {}
    updateProgress(boxes);
  }

  function updateProgress(boxes) {
    const total = boxes.length;
    const done  = Array.from(boxes).filter(b => b.checked).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('counts').textContent = done + ' / ' + total;
    document.getElementById('bar').style.width = pct + '%';
    boxes.forEach(b => b.closest('li').classList.toggle('done', b.checked));
  }

  function switchTo(key) {
    activeKey = key;
    try { localStorage.setItem(STORAGE + ':active', key); } catch (e) {}
    renderTabs();
    renderPanel();
  }

  window.resetChecks = function () {
    const car = CARS.find(c => c.key === activeKey);
    if (!confirm(`Clear all checks for ${car.title}?`)) return;
    delete state[activeKey];
    try { localStorage.setItem(STORAGE, JSON.stringify(state)); } catch (e) {}
    renderPanel();
  };

  // restore last active tab
  try {
    const last = localStorage.getItem(STORAGE + ':active');
    if (last && CARS.some(c => c.key === last)) activeKey = last;
  } catch (e) {}

  renderTabs();
  renderPanel();
})();
</script>
</body>
</html>
