name: Daily car-deal scrape + Firebase deploy

# Schedule: 9 AM Vancouver time. GitHub cron is UTC.
# PDT (summer) = UTC-7, so 9 AM PDT = 16:00 UTC.
# PST (winter) = UTC-8, so 9 AM PST = 17:00 UTC.
# Compromise: run at 16:30 UTC (= 9:30 PDT / 8:30 PST). Adjust if you prefer.
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch: {}   # allow manual run from Actions tab

permissions:
  contents: write         # so the action can commit refreshed data back
  id-token: write         # for Firebase service account auth (if using GOOGLE_APPLICATION_CREDENTIALS)

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper (headless)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HEADLESS: 'true'
        run: python car_deal_finder.py

      - name: Commit fresh report back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car-deals/index.html car-deals/data.json deals_report.md || true
          if ! git diff --quiet --cached; then
            git commit -m "auto: refresh car-deal report $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no listing changes — nothing to commit"
          fi

      - name: Setup Node (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN" --project bc-car-finder --non-interactive
